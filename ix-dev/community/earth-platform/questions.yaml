groups:
  - name: Earth Platform Configuration
    description: Configure Earth Platform
  - name: User and Group Configuration
    description: Configure User and Group for Earth Platform
  - name: Network Configuration
    description: Configure Network for Earth Platform
  - name: Storage Configuration
    description: Configure Storage for Earth Platform
  - name: Labels Configuration
    description: Configure Labels for Earth Platform
  - name: Resources Configuration
    description: Configure Resources for Earth Platform

questions:
  - variable: TZ
    group: Earth Platform Configuration
    label: Timezone
    schema:
      type: string
      default: Etc/UTC
      required: true
      $ref:
        - definitions/timezone

  - variable: earth_platform
    label: ""
    group: Earth Platform Configuration
    schema:
      type: dict
      attrs:
        - variable: eula
          label: EULA
          description: Accept the Minecraft EULA (https://aka.ms/MinecraftEULA)
          schema:
            type: boolean
            default: false
            required: true
        - variable: image_selector
          label: Image Selector
          description: Java version to use
          schema:
            type: string
            default: image
            required: true
            enum:
              - value: j17_image
                description: Java 17
              - value: image
                description: Java 21
              - value: j25_image
                description: Java 25
        - variable: version
          label: Minecraft Version
          description: Minecraft version (must match Earth Platform requirements)
          schema:
            type: string
            default: "1.21.1"
            required: true
        - variable: level_type
          label: Level Type
          description: Set to earthplatform:earth for Earth Platform world
          schema:
            type: string
            default: "earthplatform:earth"
            required: true
        - variable: motd
          label: Message of the Day
          schema:
            type: string
            default: "Welcome to Earth Platform!"
            required: true
        - variable: mode
          label: Game Mode
          schema:
            type: string
            default: "survival"
            required: true
            enum:
              - value: survival
                description: Survival
              - value: creative
                description: Creative
              - value: adventure
                description: Adventure
              - value: spectator
                description: Spectator
        - variable: difficulty
          label: Difficulty
          schema:
            type: string
            default: "easy"
            required: true
            enum:
              - value: peaceful
                description: Peaceful
              - value: easy
                description: Easy
              - value: normal
                description: Normal
              - value: hard
                description: Hard
        - variable: max_players
          label: Max Players
          schema:
            type: int
            default: 20
            required: true
            min: 1
            max: 100
        - variable: seed
          label: Seed
          description: World seed (optional)
          schema:
            type: string
            default: ""
        - variable: pvp
          label: PVP
          schema:
            type: boolean
            default: true
        - variable: allow_flight
          label: Allow Flight
          schema:
            type: boolean
            default: false
        - variable: online_mode
          label: Online Mode
          schema:
            type: boolean
            default: true
        - variable: view_distance
          label: View Distance
          schema:
            type: int
            default: 10
            required: true
            min: 2
            max: 32
        - variable: simulation_distance
          label: Simulation Distance
          schema:
            type: int
            default: 10
            required: true
            min: 2
            max: 32
        - variable: ops
          label: Operators
          description: List of Minecraft usernames to make operators
          schema:
            type: list
            default: []
            items:
              - variable: op
                label: Operator Username
                schema:
                  type: string
                  required: true
        - variable: whitelist
          label: Whitelist
          schema:
            type: list
            default: []
            items:
              - variable: whitelist_user
                label: Username
                schema:
                  type: string
                  required: true
        - variable: additional_envs
          label: Additional Environment Variables
          schema:
            type: list
            default: []
            items:
              - variable: env
                label: Environment Variable
                schema:
                  type: dict
                  attrs:
                    - variable: name
                      label: Name
                      schema:
                        type: string
                        required: true
                    - variable: value
                      label: Value
                      schema:
                        type: string
                        required: true
        - variable: memory
          label: Memory (e.g., 4G)
          description: JVM memory limit
          schema:
            type: string
            default: "4G"
            required: true

  - variable: run_as
    label: ""
    group: User and Group Configuration
    schema:
      type: dict
      attrs:
        - variable: user
          label: User ID
          schema:
            type: int
            default: 568
            required: true
        - variable: group
          label: Group ID
          schema:
            type: int
            default: 568
            required: true

  - variable: network
    label: ""
    group: Network Configuration
    schema:
      type: dict
      attrs:
        - variable: server_port
          label: Server Port
          schema:
            type: dict
            attrs:
              - variable: bind_mode
                label: Port Bind Mode
                schema:
                  type: string
                  default: "published"
                  enum:
                    - value: "published"
                      description: Publish port on host
                    - value: "exposed"
                      description: Expose port for inter-container communication
                    - value: "none"
                      description: Not published
              - variable: port_number
                label: Port Number
                schema:
                  type: int
                  default: 25565
                  min: 1
                  max: 65535
              - variable: host_ips
                label: Host IPs
                schema:
                  type: list
                  default: []
                  items:
                    - variable: host_ip
                      label: Host IP
                      schema:
                        type: string
                        required: true

  - variable: storage
    label: ""
    group: Storage Configuration
    schema:
      type: dict
      attrs:
        - variable: data
          label: Earth Platform Data Storage
          description: Storage for world data, config, and mods
          schema:
            type: dict
            attrs:
              - variable: type
                label: Type
                schema:
                  type: string
                  required: true
                  immutable: true
                  default: "ix_volume"
                  enum:
                    - value: "host_path"
                      description: Host Path (Path that already exists on the system)
                    - value: "ix_volume"
                      description: ixVolume (Dataset created automatically by the system)
              - variable: dataset_name
                label: Dataset Name
                schema:
                  type: string
                  required: true
                  immutable: true
                  default: "data"
                  $ref:
                    - "normalize/ix_volume"
              - variable: host_path_config
                label: host_path_config
                schema:
                  type: dict
                  attrs:
                    - variable: path
                      label: Path
                      schema:
                        type: hostpath
                        required: true
              - variable: ix_volume_config
                label: ix_volume_config
                schema:
                  type: dict
                  attrs:
                    - variable: acl_enable
                      label: ACL Enable
                      schema:
                        type: boolean
                        default: false
                    - variable: dataset_name
                      label: Dataset Name
                      schema:
                        type: string
                        required: true
                        default: "data"
              - variable: mount_path
                label: Mount Path
                schema:
                  type: path
                  required: true
                  immutable: true
                  default: "/data"

  - variable: labels
    label: ""
    group: Labels Configuration
    schema:
      type: list
      default: []
      items:
        - variable: label
          label: Label
          schema:
            type: dict
            attrs:
              - variable: key
                label: Key
                schema:
                  type: string
                  required: true
              - variable: value
                label: Value
                schema:
                  type: string
                  required: true
              - variable: containers
                label: Containers
                schema:
                  type: list
                  items:
                    - variable: container
                      label: Container
                      schema:
                        type: string
                        required: true
                        enum:
                          - value: earth-platform
                            description: earth-platform

  - variable: resources
    label: ""
    group: Resources Configuration
    schema:
      type: dict
      attrs:
        - variable: limits
          label: Limits
          schema:
            type: dict
            attrs:
              - variable: cpus
                label: CPUs
                schema:
                  type: int
                  default: 2
                  required: true
              - variable: memory
                label: Memory
                schema:
                  type: int
                  default: 4096
                  required: true
